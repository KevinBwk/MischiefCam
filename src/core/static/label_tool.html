<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{PRODUCT}} 影片標註</title>
<style>
  :root { --bg:#f6f6f4; --panel:#fff; --text:#1d1d1f; --muted:#6b6b70; --line:#dcdcd8;
          --pos:#d93a3a; --neg:#2f9e5b; --unc:#c08a12; --accent:#2b6cb0; }
  * { box-sizing: border-box; }
  html, body { overflow-x: hidden; }
  body { margin:0; font:14px/1.5 -apple-system,BlinkMacSystemFont,"PingFang TC","Noto Sans TC","Segoe UI",sans-serif; background:var(--bg); color:var(--text); }
  header { display:flex; gap:12px; align-items:baseline; padding:12px 20px; background:var(--panel); border-bottom:1px solid var(--line); }
  header h1 { font-size:17px; margin:0; }
  header .meta { color:var(--muted); font-size:12px; }
  main { display:grid; grid-template-columns: 300px minmax(0,1fr) 330px; gap:14px; padding:14px 20px; height: calc(100vh - 50px); }
  @media (max-width: 1100px) { main { grid-template-columns: 1fr; height:auto; } video { max-height: 50vh; } #list { max-height: 30vh; } }
  .card { background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:12px; }
  .card h2 { font-size:12px; text-transform:uppercase; letter-spacing:.04em; color:var(--muted); margin:0 0 8px; }
  #list { overflow:auto; }
  .clip { padding:7px 8px; border-radius:7px; cursor:pointer; display:grid; grid-template-columns:12px 1fr; gap:8px; align-items:center; font-size:12.5px; word-break:break-all; }
  .clip:hover { background:#f2f2ef; }
  .clip.active { background:#e8f0fa; }
  .dot { width:10px; height:10px; border-radius:50%; background:#ccc; }
  .dot.positive { background:var(--pos); } .dot.negative { background:var(--neg); } .dot.uncertain { background:var(--unc); }
  .progress { font-size:12px; color:var(--muted); margin-bottom:8px; }
  video { width:100%; max-height:calc(100vh - 230px); background:#000; border-radius:8px; display:block; }
  .timeline { position:relative; height:26px; margin-top:8px; background:#eee; border-radius:6px; overflow:hidden; cursor:pointer; }
  .timeline .seg { position:absolute; top:0; bottom:0; opacity:.75; }
  .timeline .cursor { position:absolute; top:0; bottom:0; width:2px; background:#111; }
  .timeline .pending { position:absolute; top:0; bottom:0; background:rgba(43,108,176,.35); border-left:2px solid var(--accent); }
  .controls { display:flex; gap:8px; flex-wrap:wrap; align-items:center; margin-top:8px; }
  .time { font: 13px ui-monospace, monospace; min-width: 120px; }
  button { font:inherit; border:1px solid var(--line); background:#fafafa; border-radius:7px; padding:5px 10px; cursor:pointer; }
  button:hover { background:#f0f0ee; }
  button.primary { background:var(--accent); color:#fff; border-color:var(--accent); }
  .labelbtns button { min-width:92px; font-weight:600; }
  .labelbtns .positive { color:var(--pos); } .labelbtns .negative { color:var(--neg); } .labelbtns .uncertain { color:var(--unc); }
  .labelbtns button.on.positive { background:var(--pos); color:#fff; } .labelbtns button.on.negative { background:var(--neg); color:#fff; }
  .labelbtns button.on.uncertain { background:var(--unc); color:#fff; }
  label.f { display:block; font-size:12px; color:var(--muted); margin-top:8px; }
  select, input[type=text] { font:inherit; width:100%; padding:4px 6px; border:1px solid var(--line); border-radius:6px; margin-top:2px; }
  .segrow { display:grid; grid-template-columns: 10px 1fr auto; gap:8px; align-items:center; padding:6px 0; border-bottom:1px solid #f0f0ee; font-size:12.5px; }
  .segrow .sw { width:10px; height:24px; border-radius:3px; }
  .hint { font-size:12px; background:#f7f4ea; border:1px solid #eadfba; border-radius:8px; padding:8px; margin-top:8px; }
  .hint b { text-transform:uppercase; }
  #status { font-size:12.5px; min-height:18px; margin-top:8px; }
  #status.ok { color:var(--neg); } #status.err { color:var(--pos); }
  .help { font-size:12px; color:var(--muted); margin:0; padding-left:16px; }
  kbd { font:11px ui-monospace,monospace; border:1px solid var(--line); border-bottom-width:2px; border-radius:4px; padding:0 4px; background:#fafafa; }
  .right { overflow:auto; }
</style>
</head>
<body>
<header><h1>{{PRODUCT}} · 影片標註</h1><span class="meta" id="meta"></span></header>
<main>
  <section class="card" id="list"><h2>影片清單</h2><div class="progress" id="progress"></div><div id="clips"></div></section>
  <section class="card">
    <video id="vid" controls preload="auto" playsinline></video>
    <div class="timeline" id="timeline"><div class="cursor" id="cursor"></div></div>
    <div class="controls">
      <span class="time" id="time">0.00 / 0.00 s</span>
      <button id="back">◀ 0.1 秒</button><button id="fwd">0.1 秒 ▶</button>
      <button id="markStart">起點 <kbd>[</kbd></button><button id="markEnd">終點 <kbd>]</kbd></button>
      <button id="whole">整支影片</button>
    </div>
    <div class="controls labelbtns" style="margin-top:10px">
      <button class="positive" data-label="positive">正例：咬沙發 <kbd>1</kbd></button>
      <button class="negative" data-label="negative">負例：沒在咬 <kbd>2</kbd></button>
      <button class="uncertain" data-label="uncertain">不確定：看不清楚 <kbd>3</kbd></button>
      <button class="primary" id="addSeg">加入時間段 <kbd>A</kbd></button>
    </div>
  </section>
  <section class="right">
    <div class="card">
      <h2>時間段細節</h2>
      <label class="f">狗在做什麼
        <select id="behavior"></select></label>
      <label class="f">嘴碰到什麼（可填中文或英文）
        <input type="text" id="target" placeholder="例如：沙發扶手、繩子玩具"></label>
      <label class="f">嘴巴看得清楚嗎
        <select id="visibility"><option value="clear">清楚</option><option value="partial">部分可見</option><option value="unobservable">看不到</option></select></label>
      <div class="hint" id="hint" hidden></div>
    </div>
    <div class="card" style="margin-top:12px">
      <h2>這支影片的時間段</h2>
      <div id="segs"></div>
      <label class="f"><input type="checkbox" id="simulated"> AI 生成／模擬影片</label>
      <label class="f">確認有造成損壞嗎
        <select id="damage"><option value="unknown">不知道</option><option value="yes">有</option><option value="no">沒有</option></select></label>
      <label class="f">來源備註（生成工具、授權、拍攝者）
        <input type="text" id="source"></label>
      <div class="controls"><button class="primary" id="save">儲存 <kbd>S</kbd></button><button id="next">下一支未標註 <kbd>N</kbd></button></div>
      <div id="status"></div>
    </div>
    <div class="card" style="margin-top:12px">
      <h2>操作說明</h2>
      <ul class="help">
        <li>播放影片，<kbd>空白鍵</kbd>暫停，<kbd>←</kbd>／<kbd>→</kbd> 前後移動 0.1 秒。</li>
        <li>行為開始時按 <kbd>[</kbd>、結束時按 <kbd>]</kbd>，選好類別後按<b>加入時間段</b>，最後按<b>儲存</b>。</li>
        <li>整支影片都一樣時，選好類別直接按<b>整支影片</b>。</li>
        <li>照<b>實際看到的</b>標，不是照 prompt。黃色框只是提示。</li>
        <li><b>正例</b>：嘴反覆咬、啃、拉扯沙發約 2 秒以上。咬自己的玩具算<b>負例</b>。嘴巴看不到標<b>不確定</b>。</li>
        <li>沒標的時段訓練時會略過。</li>
      </ul>
    </div>
  </section>
</main>
<script>
(() => {
  const $ = id => document.getElementById(id);
  const vid = $('vid'), tl = $('timeline'), cursor = $('cursor');
  const COLORS = { positive: '#d93a3a', negative: '#2f9e5b', uncertain: '#c08a12' };
  // UI text is Chinese; saved values stay English
  const LABEL_ZH = { positive: '正例', negative: '負例', uncertain: '不確定' };
  const VIS_ZH = { clear: '清楚', partial: '部分可見', unobservable: '看不到' };
  const BEH_ZH = { chewing_furniture: '咬家具／沙發', chewing_toy: '咬玩具／骨頭', sniffing: '聞', licking_object: '舔東西',
    licking_self: '舔自己', resting: '躺著／睡覺', sitting: '坐著', walking: '走動', carrying: '叼著東西走', playing: '玩耍',
    scratching_self: '抓癢', rolling: '翻滾', person_present: '有人在場', unobservable: '看不到嘴', other: '其他' };
  let clips = [], cur = -1, segs = [], mark = { start: null, end: null }, chosen = 'negative', dirty = false;

  const status = (m, c = '') => { $('status').textContent = m; $('status').className = c; };
  const fmt = t => (t ?? 0).toFixed(2);
  const dur = () => (isFinite(vid.duration) ? vid.duration : 0);

  function renderList() {
    const done = clips.filter(c => c.label).length;
    $('progress').textContent = `已標註 ${done} / ${clips.length} 支`;
    $('clips').innerHTML = '';
    clips.forEach((c, i) => {
      const el = document.createElement('div');
      el.className = 'clip' + (i === cur ? ' active' : '');
      el.innerHTML = `<span class="dot ${c.label || ''}"></span><span></span>`;
      el.lastChild.textContent = c.path;
      el.onclick = () => open(i);
      $('clips').appendChild(el);
    });
  }

  function renderTimeline() {
    tl.querySelectorAll('.seg,.pending').forEach(n => n.remove());
    const d = dur(); if (!d) return;
    segs.forEach(s => {
      const end = s.end_s < 0 ? d : s.end_s;
      const n = document.createElement('div'); n.className = 'seg';
      n.style.left = `${(s.start_s / d) * 100}%`; n.style.width = `${((end - s.start_s) / d) * 100}%`;
      n.style.background = COLORS[s.label]; tl.appendChild(n);
    });
    if (mark.start != null) {
      const end = mark.end ?? vid.currentTime;
      const n = document.createElement('div'); n.className = 'pending';
      n.style.left = `${(Math.min(mark.start, end) / d) * 100}%`;
      n.style.width = `${(Math.abs(end - mark.start) / d) * 100}%`; tl.appendChild(n);
    }
    cursor.style.left = `${(vid.currentTime / d) * 100}%`;
  }

  function renderSegs() {
    $('segs').innerHTML = segs.length ? '' : '<div class="help" style="padding:0">還沒有時間段。</div>';
    segs.forEach((s, i) => {
      const row = document.createElement('div'); row.className = 'segrow';
      const end = s.end_s < 0 ? '結尾' : fmt(s.end_s);
      row.innerHTML = `<span class="sw" style="background:${COLORS[s.label]}"></span>
        <span><b>${LABEL_ZH[s.label]}</b> ${fmt(s.start_s)}–${end} 秒<br><span style="color:#6b6b70">${BEH_ZH[s.behavior] || s.behavior}${s.target ? ' · ' + s.target : ''} · ${VIS_ZH[s.visibility] || s.visibility}</span></span>
        <button title="刪除">✕</button>`;
      row.querySelector('button').onclick = () => { segs.splice(i, 1); dirty = true; renderSegs(); renderTimeline(); status('尚未儲存'); };
      row.onclick = ev => { if (ev.target.tagName !== 'BUTTON') vid.currentTime = s.start_s; };
      $('segs').appendChild(row);
    });
  }

  function choose(label) {
    chosen = label;
    document.querySelectorAll('.labelbtns [data-label]').forEach(b => b.classList.toggle('on', b.dataset.label === label));
    if (label === 'uncertain') $('visibility').value = 'unobservable';
  }

  function showHint(h) {
    const el = $('hint');
    if (!h) { el.hidden = true; return; }
    el.hidden = false;
    el.innerHTML = `提示（來自 ${h.source}）：預期為<b>${LABEL_ZH[h.label] || h.label}</b>${h.behavior ? '，' + (BEH_ZH[h.behavior] || h.behavior) : ''}。<br>請以影片實際內容為準，生成工具不一定照 prompt 做。`;
  }

  function confirmLeave() { return !dirty || window.confirm('這支影片有尚未儲存的變更，確定要放棄嗎？'); }

  function open(i) {
    if (i === cur || !confirmLeave()) return;
    cur = i; const c = clips[i];
    segs = JSON.parse(JSON.stringify(c.segments || []));
    mark = { start: null, end: null }; dirty = false;
    vid.src = `/video/${c.index}`;
    $('simulated').checked = c.simulated ?? (/^V\d{3}[_-]/.test(c.path.split('/').pop()) || !!(c.hint && c.hint.source !== 'file name'));
    $('damage').value = c.damage_confirmed || 'unknown';
    $('source').value = c.source_note || '';
    const h = c.hint; showHint(h);
    choose(h ? h.label : 'negative');
    $('behavior').value = h && h.behavior ? h.behavior : (h && h.label === 'positive' ? 'chewing_furniture' : 'resting');
    $('target').value = h && h.target ? h.target : '';
    $('visibility').value = 'clear';
    renderList(); renderSegs(); status('');
  }

  function addSegment(whole = false) {
    let start = whole ? 0 : mark.start, end = whole ? -1 : (mark.end ?? vid.currentTime);
    if (start == null) { status('請先按「起點」（[），或使用「整支影片」', 'err'); return; }
    if (end >= 0 && end < start) [start, end] = [end, start];
    if (end >= 0 && end - start < 0.2) { status('時間段太短', 'err'); return; }
    segs.push({ start_s: +start.toFixed(3), end_s: end < 0 ? -1 : +end.toFixed(3), label: chosen,
                behavior: $('behavior').value, target: $('target').value.trim(), visibility: $('visibility').value });
    segs.sort((a, b) => a.start_s - b.start_s);
    mark = { start: null, end: null }; dirty = true;
    renderSegs(); renderTimeline(); status('已加入時間段，記得按「儲存」');
  }

  async function save() {
    if (cur < 0) return;
    const body = { segments: segs, simulated: $('simulated').checked, damage_confirmed: $('damage').value, source_note: $('source').value };
    const res = await fetch(`/api/clips/${clips[cur].index}`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
    const data = await res.json();
    if (!res.ok) { status(data.error || '儲存失敗', 'err'); return; }
    Object.assign(clips[cur], { label: data.label, segments: data.segments, simulated: body.simulated, damage_confirmed: body.damage_confirmed, source_note: body.source_note });
    segs = JSON.parse(JSON.stringify(data.segments)); dirty = false;
    renderList(); renderSegs(); status(data.label ? `已儲存 · 整支影片判定：${LABEL_ZH[data.label]}` : '已儲存（沒有時間段，已清除這支影片的標註）', 'ok');
  }

  function nextUnlabeled() {
    const n = clips.findIndex((c, i) => i > cur && !c.label);
    const k = n >= 0 ? n : clips.findIndex(c => !c.label);
    if (k >= 0) open(k); else status('全部影片都標完了 🎉', 'ok');
  }

  // events
  vid.addEventListener('timeupdate', () => { $('time').textContent = `${fmt(vid.currentTime)} / ${fmt(dur())} s`; renderTimeline(); });
  vid.addEventListener('loadedmetadata', () => { $('time').textContent = `0.00 / ${fmt(dur())} s`; renderTimeline(); });
  tl.addEventListener('click', ev => { const r = tl.getBoundingClientRect(); vid.currentTime = ((ev.clientX - r.left) / r.width) * dur(); });
  $('back').onclick = () => { vid.currentTime = Math.max(0, vid.currentTime - 0.1); };
  $('fwd').onclick = () => { vid.currentTime = Math.min(dur(), vid.currentTime + 0.1); };
  $('markStart').onclick = () => { mark = { start: vid.currentTime, end: null }; renderTimeline(); status(`起點：${fmt(mark.start)} 秒`); };
  $('markEnd').onclick = () => { if (mark.start == null) { status('請先按「起點」', 'err'); return; } mark.end = vid.currentTime; renderTimeline(); status(`已選取 ${fmt(mark.start)}–${fmt(mark.end)} 秒`); };
  $('whole').onclick = () => addSegment(true);
  $('addSeg').onclick = () => addSegment(false);
  $('save').onclick = save;
  $('next').onclick = nextUnlabeled;
  document.querySelectorAll('.labelbtns [data-label]').forEach(b => b.onclick = () => choose(b.dataset.label));
  ['simulated', 'damage', 'source'].forEach(id => $(id).addEventListener('input', () => { dirty = true; }));

  window.addEventListener('keydown', ev => {
    if (['INPUT', 'SELECT', 'TEXTAREA'].includes(ev.target.tagName)) return;
    const k = ev.key;
    if (k === ' ') { ev.preventDefault(); vid.paused ? vid.play() : vid.pause(); }
    else if (k === 'ArrowLeft') { ev.preventDefault(); $('back').onclick(); }
    else if (k === 'ArrowRight') { ev.preventDefault(); $('fwd').onclick(); }
    else if (k === '[') $('markStart').onclick();
    else if (k === ']') $('markEnd').onclick();
    else if (k === '1') choose('positive'); else if (k === '2') choose('negative'); else if (k === '3') choose('uncertain');
    else if (k === 'a' || k === 'A') addSegment(false);
    else if (k === 's' || k === 'S') { ev.preventDefault(); save(); }
    else if (k === 'n' || k === 'N') nextUnlabeled();
  });
  window.addEventListener('beforeunload', ev => { if (dirty) { ev.preventDefault(); ev.returnValue = ''; } });

  (async () => {
    const data = await (await fetch('/api/clips')).json();
    clips = data.clips;
    $('meta').textContent = `共 ${clips.length} 支 · 儲存到 ${data.labels_path}`;
    $('behavior').innerHTML = data.behaviors.map(b => `<option value="${b}">${BEH_ZH[b] || b}</option>`).join('');
    renderList();
    if (clips.length) open(clips.findIndex(c => !c.label) >= 0 ? clips.findIndex(c => !c.label) : 0);
  })();
})();
</script>
</body>
</html>
